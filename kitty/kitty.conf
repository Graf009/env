font_family SauceCodePro Nerd Font Mono

font_size 15

enabled_layouts tall:bias=54

enable_audio_bell off

mouse_hide_wait 1.0

active_border_color #999
tab_title_template "{ index }"
include ./OneDark.conf
active_tab_background #999
inactive_tab_background #555
inactive_tab_foreground #000
macos_traditional_fullscreen on
confirm_os_window_close 0

map cmd+[ previous_window
map cmd+] next_window
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6

map cmd+g show_last_command_output

# Russian layout (ЙЦУКЕН) duplicates.
# kitty matches shortcuts by the character the active layout produces, not by
# physical key, and has no layout-agnostic mapping (kovidgoyal/kitty#606), so
# every shortcut needs a Cyrillic twin. Letters below are Cyrillic homographs —
# "с" is U+0441, not Latin "c". Digits are identical in both layouts.
# No trailing comments: kitty only treats "#" as a comment at line start, so an
# inline one is parsed as part of the action.
# м=v  с=c  е=t  ц=w  т=n  й=q  л=k  х=[  ъ=]  п=g
map cmd+м paste_from_clipboard
map cmd+с copy_or_noop
map cmd+е new_tab
map cmd+ц close_window
map cmd+т new_os_window
map cmd+й quit
map cmd+л clear_terminal to_cursor active
map cmd+х previous_window
map cmd+ъ next_window
map cmd+п show_last_command_output